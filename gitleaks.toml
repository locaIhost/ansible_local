[allowlist]
description = "Ignore valid Ansible Vault encrypted files and Jinja2 placeholders"

regexes = [
  "^\\$ANSIBLE_VAULT;.*$", 
  "{{.*}}"
]

[[rules]]
id = "ansible-api-key"
description = "Ansible variable with potential API key"
regex = "(?i)api_key:\\s*[A-Za-z0-9]{32,}"
path = "\\.yml$|\\.yaml$"
tags = ["ansible", "api-key"]

[[rules]]
id = "ansible-password"
description = "Ansible variable with potential password"
regex = "(?i)password:\\s*[A-Za-z0-9!@#$%^&*]{8,}"
path = "\\.yml$|\\.yaml$"
tags = ["ansible", "password"]
