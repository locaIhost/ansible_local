- name: Transfer grafana docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ grafana_local_dir }}{{ grafana_docker_endf }}"
    owner: "{{ grafana_default_og }}"
    group: "{{ grafana_default_og }}"
    mode: '{{ grafana_default_file_mode }}'

- name: Transfer grafana .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ grafana_local_dir }}{{ grafana_env_endf }}"
    owner: "{{ grafana_default_og }}"
    group: "{{ grafana_default_og }}"
    mode: '{{ grafana_default_file_mode }}'
