pw_package_deb_like:
  - libpam-pwquality
  - libpwquality-common
# pam template
pam_pwquality_retry: 3
pam_common_password: common-password
pam_common_auth: common-auth
# vars for faillock
faillock_log_f: "faillock"
faillock_log_d: "/var/log/"
faillock_conf_f: "faillock.conf"
faillock_audit: True
faillock_silent: True
faillock_no_syslog: True
faillock_local_only: True
faillock_root_deny: True
faillock_deny_count_login: 3
faillock_fail_interval: 900
faillock_unlock_time: 1800
faillock_unlock_root_time: 1800
faillock_admin_group: True
# default vars for security
pw_default_rhel_dir: /etc/security/pwquality.conf.d/
pw_package_rhel:
  - libpwquality
  - authselect
  - authselect-libs
pw_default_pam_dir: /etc/pam.d/
pw_default_dir: /etc/security/
pw_default_pam_pass_f:  common-password
pw_pwq_f: pwquality.conf
pw_pwh_dir: "{{ pw_default_dir }}"
pw_pwh_f: pwhistory.conf
pw_pwh_log_f: opasswd
# Password policy / Парольная политика
pw_min: 16
pw_minclass: 4
pw_difok: 5
# Speacial symbol / Специальные символы
pw_dcredit: -1
pw_lcredit: -1
pw_ucredit: -1
pw_ocredit: -1
# Protection against repetitions / Защита от повторений
pw_maxrepeat: 3
pw_maxclassrepeat: 3
pw_dictcheck: 1
pw_usercheck: 1
pw_gecoscheck: 1
pw_usersubstr: 3
# Include enforcing / Включение принуждений
pw_enforcing: 1
# U can change True or False :)
pw_enforcing_for_root: True
# Integrety hybrid domain auth / Необходимо митишации проблем с домеными пользователями (FreeIPA)
pw_local_users_only: True
#### Setting for pw history
pwh_remember: 5
pwh_retry: 3
pwh_common_password_pam_line: "password requisite pam_pwhistory.so use_authtok local_users_only enforce_for_root"
pwh_common_password_pam_rhel_line: "password    required      pam_pwhistory.so use_authtok"
pwh_test_authselect_system_auth_f: system-auth
pwqh_authselect_name_profile: hardening-pwnqh
pwh_test_authselect_custom_d: "/etc/authselect/custom/{{ pwqh_authselect_name_profile }}/"