---
- name: Check or install libpam-pwquality
  ansible.builtin.apt:
    name: libpam-pwquality
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Check if "{{ pw_pwh_log_f }}" exists
  ansible.builtin.stat:
    path: "{{ pw_pwh_dir }}{{ pw_pwh_log_f }}"
  register: var_pwh

- name: Check or create "{{ pw_pwh_log_f }}" file
  ansible.builtin.file:
    dest: "{{ pw_pwh_dir }}{{ pw_pwh_log_f }}"
    state: touch
    owner: root
    group: root
    mode: '0600'
  when: not var_pwh.stat.exists

- name: Ensure pam_pwhistory is present after pwquality
  ansible.builtin.lineinfile:
    path: "{{ pw_default_pam_dir }}{{ pw_default_pam_pass_f }}"
    line: "{{ pwh_common_password_pam_line }}"
    insertafter: '^password\s+requisite\s+pam_pwquality\.so'
    firstmatch: yes
    state: present